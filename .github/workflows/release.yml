# Compile l'installeur macOS sur un Mac (Apple Silicon) de GitHub et le publie dans les Releases.
# Se lance quand on pousse un tag de version (ex. v0.1.0), ou à la main depuis l'onglet Actions.
# Les minutes macOS coûtent plus cher que les minutes Linux : on ne compile qu'à ce moment-là.
name: Release macOS
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Compiler le moteur (PyInstaller)
        run: bash scripts/build_backend.sh
      - name: Tester le moteur compilé sur la vidéo de synthèse
        env:
          GEOTRACK_BACKEND: ${{ github.workspace }}/extension/bin/geotrack-backend/geotrack-backend
        run: python tests/synthetic_test.py
      - name: Fabriquer l'installeur .pkg
        run: bash scripts/build_pkg.sh "${{ steps.v.outputs.version }}"
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/*.pkg dist/*.zip --clobber
            exit 0
          fi
          gh release create "v$V" dist/*.pkg dist/*.zip --title "Gragarda GeoTrack $V" \
            --notes "Installeur macOS (Apple Silicon). Double-clic sur le .pkg, puis redémarre After Effects : Fenêtre > Extensions > Gragarda GeoTrack. Voir le README pour la première ouverture d'un installeur non signé."
