# Tests à chaque push : sur Linux, c'est le moins cher en minutes GitHub Actions.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless playwright
          python -m playwright install --with-deps chromium
      - name: Maths du panneau (pose.js)
        run: node tests/pose.test.js
      - name: Moteur de tracking (vidéo de synthèse)
        run: python tests/synthetic_test.py
      - name: Panneau complet dans Chromium (AE simulé)
        run: python tests/ui_test.py --shots test-shots
      - name: Captures d'écran du test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-panneau
          path: test-shots
          retention-days: 7
